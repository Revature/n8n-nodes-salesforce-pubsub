name: Publish

# Release on merge: every push to main checks whether the package.json version is already on npm.
# A new version is built in one job and published from a separate job, after approval on the `npm`
# environment, with trusted publishing (OIDC): no npm token exists in this repo, and every version
# carries a provenance attestation. The git tag and GitHub release are created afterwards.
#
# Build and publish are split on purpose. Only the publish job can obtain an npm OIDC token, and it
# installs nothing and runs no package code: it uploads the tarball the build job produced. So a
# compromised dev dependency can never run where it could publish.
on:
  push:
    branches: [main]
  workflow_dispatch: # re-run a release whose publish or release step failed

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Is this version already on npm?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Empty for an unpublished version of an existing package; "E404" for a new package.
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not on npm yet; building for release."
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # no id-token: this job cannot publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:supply-chain
      - name: Pack
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers on this environment (Settings → Environments → npm) approve every release.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing + provenance
    steps:
      # No checkout and no npm install: this job only uploads the tarball built above.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # No registry-url on purpose: it writes an .npmrc token placeholder that breaks trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Publish the built tarball
        run: |
          tarball=$(ls *.tgz)
          echo "Publishing $tarball ($(sha256sum "$tarball" | cut -c1-16)…)"
          npm publish "./$tarball" --provenance --access public --ignore-scripts

  release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub release
    steps:
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
