name: Dependency review

# Blocks a pull request that adds or upgrades to a dependency with a known high/critical
# vulnerability. Development scope is included on purpose: the libraries this node bundles are
# devDependencies, so a runtime-only check would miss exactly the code that ships.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # summary comment on the PR

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          comment-summary-in-pr: on-failure
